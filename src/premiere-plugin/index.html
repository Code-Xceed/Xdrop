<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Xdrop</title>
    <link rel="icon" type="image/png" href="icons/iconNormal.png">
    <script src="js/CSInterface.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #09090b;
            color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 12px;
        }
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            background: #09090b;
        }
        #status-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 32px 24px;
            gap: 16px;
            background: radial-gradient(circle at 50% 30%, #18181b 0%, #09090b 80%);
        }
        .pulse-badge {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 24px rgba(0, 229, 255, 0.15);
            animation: pulse 2.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.04); opacity: 1; box-shadow: 0 0 32px rgba(0, 229, 255, 0.3); }
        }
        .badge-icon {
            font-size: 24px;
            line-height: 1;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00e5ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .title-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .app-title-row {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .brand-x {
            color: #00e5ff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .brand-drop {
            color: #fafafa;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .host-badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 2px 7px;
            border-radius: 4px;
            background: rgba(0, 229, 255, 0.1);
            color: #00e5ff;
            border: 1px solid rgba(0, 229, 255, 0.25);
            margin-bottom: 2px;
        }
        .status-title {
            font-size: 14px;
            font-weight: 600;
            color: #e4e4e7;
            margin-top: 2px;
        }
        .status-desc {
            font-size: 12px;
            color: #71717a;
            max-width: 290px;
            line-height: 1.5;
        }
        .action-btn {
            background: #00e5ff;
            color: #09090b;
            border: none;
            padding: 9px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.02em;
            transition: all 0.15s ease-out;
            box-shadow: 0 2px 10px rgba(0, 229, 255, 0.25);
        }
        .action-btn:hover {
            background: #38bdf8;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(0, 229, 255, 0.4);
        }
        .action-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <iframe id="app-frame" src=""></iframe>

    <div id="status-container">
        <div class="pulse-badge" id="badge-wrapper">
            <img src="icons/logo-48.png" alt="Xdrop" style="width: 38px; height: 38px; object-fit: contain;">
        </div>
        <div id="status-spinner" class="spinner" style="display: none;"></div>

        <div class="title-block">
            <span id="host-badge" class="host-badge">Premiere Pro</span>
            <div class="app-title-row">
                <span class="brand-x">X</span>
                <span class="brand-drop">drop</span>
            </div>
            <div id="status-title" class="status-title">Connecting to Engine...</div>
        </div>

        <p id="status-desc" class="status-desc">
            The background media service starts automatically. Once online, your studio workspace will load right here.
        </p>

        <button id="status-btn" class="action-btn" style="display: none;" onclick="manualRetry()">Start Engine</button>
    </div>

    <script>
        const csInterface = new CSInterface();
        let currentHost = 'premiere';
        let hostLabel = 'Premiere Pro';

        try {
            const env = csInterface.getHostEnvironment();
            if (env && env.appId === 'AEFT') {
                currentHost = 'aftereffects';
                hostLabel = 'After Effects';
                document.title = 'Xdrop — After Effects';
            } else if (env && env.appId === 'AUDT') {
                currentHost = 'audition';
                hostLabel = 'Audition';
                document.title = 'Xdrop — Audition';
            } else {
                currentHost = 'premiere';
                hostLabel = 'Premiere Pro';
                document.title = 'Xdrop — Premiere Pro';
            }
        } catch (_) {}

        const hostBadgeEl = document.getElementById('host-badge');
        if (hostBadgeEl) hostBadgeEl.textContent = hostLabel;

        const appFrame = document.getElementById('app-frame');
        const statusContainer = document.getElementById('status-container');
        const statusSpinner = document.getElementById('status-spinner');
        const badgeWrapper = document.getElementById('badge-wrapper');
        const statusTitle = document.getElementById('status-title');
        const statusDesc = document.getElementById('status-desc');
        const statusBtn = document.getElementById('status-btn');

        let ws = null;
        let isEngineOnline = false;
        let isAutoStarting = false;

        function setStatus(title, desc, showSpinner, showButton) {
            statusContainer.style.display = 'flex';
            appFrame.style.display = 'none';
            statusTitle.textContent = title;
            statusDesc.textContent = desc;
            statusSpinner.style.display = showSpinner ? 'block' : 'none';
            badgeWrapper.style.display = showSpinner ? 'none' : 'flex';
            statusBtn.style.display = showButton ? 'inline-block' : 'none';
        }

        function showApp() {
            statusContainer.style.display = 'none';
            const targetUrl = "http://127.0.0.1:8484?host=" + currentHost;
            if (appFrame.src !== targetUrl) {
                appFrame.src = targetUrl;
            }
            appFrame.style.display = 'block';
        }

        function checkServiceHealth(callback) {
            // Vector A: Node.js direct HTTP request if available (zero CORS / Private Network restrictions)
            try {
                const req = (typeof window.require === 'function') ? window.require : (typeof require === 'function' ? require : null);
                if (req) {
                    const http = req('http');
                    if (http && typeof http.get === 'function') {
                        const reqObj = http.get('http://127.0.0.1:8484/api/health', { timeout: 1500 }, function(res) {
                            callback(res.statusCode === 200);
                        });
                        reqObj.on('error', function() {
                            callback(false);
                        });
                        reqObj.on('timeout', function() {
                            reqObj.destroy();
                            callback(false);
                        });
                        return;
                    }
                }
            } catch (_) {}

            // Vector B: Standard browser fetch
            const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
            const timeoutId = controller ? setTimeout(function() { controller.abort(); }, 1500) : null;
            const options = { method: 'GET', cache: 'no-store' };
            if (controller) options.signal = controller.signal;

            fetch('http://127.0.0.1:8484/api/health', options)
                .then(function(res) {
                    if (timeoutId) clearTimeout(timeoutId);
                    callback(res.ok);
                })
                .catch(function() {
                    if (timeoutId) clearTimeout(timeoutId);
                    // Vector C: Fallback XMLHttpRequest
                    try {
                        const xhr = new XMLHttpRequest();
                        xhr.open('GET', 'http://127.0.0.1:8484/api/health', true);
                        xhr.timeout = 1500;
                        xhr.onload = function() {
                            callback(xhr.status === 200);
                        };
                        xhr.onerror = function() {
                            callback(false);
                        };
                        xhr.ontimeout = function() {
                            callback(false);
                        };
                        xhr.send();
                    } catch (_) {
                        callback(false);
                    }
                });
        }

        function getExtensionPath() {
            try {
                if (typeof csInterface !== 'undefined' && csInterface.getSystemPath) {
                    const p = csInterface.getSystemPath('extension');
                    if (p) return p;
                }
                if (window.__adobe_cep__ && window.__adobe_cep__.getSystemPath) {
                    const p = window.__adobe_cep__.getSystemPath('extension');
                    if (p) return p;
                }
            } catch (_) {}

            try {
                let p = window.location.pathname || '';
                p = decodeURIComponent(p);
                if (/^\/[a-zA-Z]:/.test(p)) {
                    p = p.substring(1);
                }
                const lastSlash = Math.max(p.lastIndexOf('/'), p.lastIndexOf('\\'));
                if (lastSlash > -1) {
                    p = p.substring(0, lastSlash);
                }
                return p;
            } catch (_) {}

            return '';
        }

        function getLocalAppData() {
            try {
                if (typeof process !== 'undefined' && process.env && process.env.LOCALAPPDATA) {
                    return process.env.LOCALAPPDATA;
                }
            } catch (_) {}
            try {
                if (window.process && window.process.env && window.process.env.LOCALAPPDATA) {
                    return window.process.env.LOCALAPPDATA;
                }
            } catch (_) {}
            try {
                const ext = getExtensionPath();
                const idx = ext.toLowerCase().indexOf('\\appdata\\');
                if (idx !== -1) {
                    return ext.substring(0, idx) + '\\AppData\\Local';
                }
                const idxFwd = ext.toLowerCase().indexOf('/appdata/');
                if (idxFwd !== -1) {
                    return ext.substring(0, idxFwd) + '/AppData/Local';
                }
            } catch (_) {}
            return '';
        }

        function getUserHome() {
            try {
                if (typeof process !== 'undefined' && process.env && process.env.USERPROFILE) {
                    return process.env.USERPROFILE;
                }
                if (typeof process !== 'undefined' && process.env && process.env.HOME) {
                    return process.env.HOME;
                }
            } catch (_) {}
            try {
                const local = getLocalAppData();
                if (local && local.toLowerCase().includes('\\appdata\\local')) {
                    return local.substring(0, local.toLowerCase().indexOf('\\appdata\\local'));
                }
            } catch (_) {}
            return '';
        }

        // Headless, multi-vector auto-start for all Adobe host environments
        function tryAutoStartEngine() {
            if (isAutoStarting) return;
            isAutoStarting = true;

            setStatus("Starting Xdrop Engine...", "Initializing background service...", true, false);

            const isWin = navigator.platform.indexOf('Win') > -1 || (typeof process !== 'undefined' && process.platform === 'win32');
            const localAppData = getLocalAppData();
            const home = getUserHome();

            // Strategy 1: CEP Native C++ Process Spawner (Adobe native, zero dependencies)
            try {
                if (window.cep && window.cep.process && typeof window.cep.process.createProcess === 'function') {
                    if (isWin) {
                        const batTargets = [
                            localAppData ? (localAppData + "\\Xdrop\\start_engine.bat") : '',
                            home ? (home + "\\AppData\\Local\\Xdrop\\start_engine.bat") : '',
                            "C:\\Users\\" + (typeof process !== 'undefined' && process.env && process.env.USERNAME ? process.env.USERNAME : '') + "\\AppData\\Local\\Xdrop\\start_engine.bat"
                        ];
                        for (let bat of batTargets) {
                            if (bat) {
                                console.log("[Xdrop CEP] Spawning via cep.process:", bat);
                                window.cep.process.createProcess("C:\\Windows\\System32\\cmd.exe", "/c", "start", "", "/b", bat);
                                break;
                            }
                        }
                    } else {
                        const sh = home ? (home + "/.xdrop/start_engine.sh") : "";
                        if (sh) {
                            window.cep.process.createProcess("/bin/sh", sh);
                        }
                    }
                }
            } catch (e) {
                console.warn("[Xdrop CEP] cep.process notice:", e);
            }

            // Strategy 2: Native ExtendScript execution via host application (Premiere, After Effects, Audition)
            if (typeof csInterface !== 'undefined' && csInterface.evalScript) {
                csInterface.evalScript('launchXdropEngine()', function(res) {
                    console.log("[Xdrop CEP] launchXdropEngine host result:", res);
                });
            }

            // Strategy 3: Node.js process spawning (when Node integration is active in CEP)
            try {
                const req = (typeof window.require === 'function') ? window.require : (typeof require === 'function' ? require : null);
                if (req) {
                    const cp = req('child_process');
                    if (cp && typeof cp.spawn === 'function') {
                        if (isWin) {
                            const batTargets = [
                                localAppData ? (localAppData + "\\Xdrop\\start_engine.bat") : '',
                                home ? (home + "\\AppData\\Local\\Xdrop\\start_engine.bat") : ''
                            ];
                            for (let bat of batTargets) {
                                if (bat) {
                                    cp.spawn('cmd.exe', ['/c', 'start', '""', '/b', bat], {
                                        detached: true,
                                        stdio: 'ignore',
                                        windowsHide: true
                                    }).unref();
                                    break;
                                }
                            }
                        } else {
                            const sh = home ? (home + "/.xdrop/start_engine.sh") : "";
                            if (sh) {
                                cp.spawn('/bin/sh', [sh], { detached: true, stdio: 'ignore' }).unref();
                            }
                        }
                    }
                }
            } catch (err) {
                console.warn("[Xdrop CEP] Node spawn notice:", err);
            }

            // Poll for service health up to 35 seconds (70 iterations * 500ms)
            let attempts = 0;
            const maxAttempts = 70;
            const pollInterval = setInterval(function() {
                attempts++;

                if (attempts === 10) {
                    setStatus("Starting Xdrop Engine...", "Loading core services...", true, false);
                } else if (attempts === 24) {
                    setStatus("Starting Xdrop Engine...", "Preparing workspace & connectors...", true, false);
                } else if (attempts === 45) {
                    setStatus("Starting Xdrop Engine...", "Finalizing engine startup...", true, false);
                }

                checkServiceHealth(function(online) {
                    if (online) {
                        clearInterval(pollInterval);
                        isAutoStarting = false;
                        isEngineOnline = true;
                        showApp();
                        connectWebSocket();
                        setupStarterBins();
                        registerSessionOpen();
                    } else if (attempts >= maxAttempts) {
                        clearInterval(pollInterval);
                        isAutoStarting = false;
                        setStatus(
                            "Engine Offline",
                            "The Xdrop background service could not be contacted. Launch Xdrop or click below to retry.",
                            false,
                            true
                        );
                    }
                });
            }, 500);
        }

        function manualRetry() {
            isAutoStarting = false;
            setStatus("Starting Engine...", "Attempting connection...", true, false);
            tryAutoStartEngine();
        }

        function setupStarterBins() {
            csInterface.evalScript('setupXdropBins()', function(res) {
                console.log("[Xdrop CEP] Canonical bins initialized:", res);
            });
        }

        function checkHostProject(callback) {
            let fn = 'getPremiereProjectInfo()';
            let endpoint = 'premiere';

            if (currentHost === 'aftereffects') {
                fn = 'getAfterEffectsProjectInfo()';
                endpoint = 'aftereffects';
            } else if (currentHost === 'audition') {
                fn = 'getAuditionProjectInfo()';
                endpoint = 'audition';
            }

            csInterface.evalScript(fn, function(res) {
                try {
                    const info = JSON.parse(res);
                    fetch('http://127.0.0.1:8484/api/' + endpoint + '/heartbeat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(info)
                    }).catch(function() {});
                    if (callback) callback(info);
                } catch(e) {
                    if (callback) callback({ isAvailable: false, error: e.toString() });
                }
            });
        }

        // Periodic project info check
        setInterval(function() {
            if (!isEngineOnline) return;
            checkHostProject(function(info) {
                const frame = document.getElementById('app-frame');
                if (frame && frame.contentWindow) {
                    frame.contentWindow.postMessage({
                        type: 'HOST_INFO',
                        host: currentHost,
                        projectInfo: info
                    }, '*');
                }
            });
        }, 8000);

        function reportImportResult(host, requestId, outcome) {
            if (!requestId) return;
            const endpoint = host === 'aftereffects' ? 'aftereffects' : (host === 'audition' ? 'audition' : 'premiere');
            fetch('http://127.0.0.1:8484/api/' + endpoint + '/import-result', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    requestId: requestId,
                    success: !!outcome.success,
                    error: outcome.error || null,
                    clipName: outcome.clipName || null,
                    binName: outcome.binName || null
                })
            }).catch(function(err) {
                console.warn("[Xdrop CEP] Could not report import result:", err);
            });
        }

        function importToHost(filePaths, binName, requestId, insertTimeline) {
            const paths = Array.isArray(filePaths) ? filePaths : [filePaths];
            if (!paths.length) return;

            const bin = String(binName || '000_Xdrop Assets');
            const outcomes = [];
            let remaining = paths.length;

            function settle() {
                remaining--;
                if (remaining > 0) return;
                const failures = outcomes.filter(function(o) { return !o.success; });
                const firstOk = outcomes.filter(function(o) { return o.success; })[0];
                reportImportResult(currentHost, requestId, {
                    success: failures.length === 0,
                    error: failures.length ? failures[0].error : null,
                    clipName: firstOk ? firstOk.clipName : null,
                    binName: bin
                });
            }

            paths.forEach(function(filePath) {
                const outcome = { success: false, error: null, clipName: null };
                outcomes.push(outcome);

                const escapedPath = String(filePath).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
                const escapedBin = bin.replace(/"/g, '\\"');
                const shouldInsert = insertTimeline ? 'true' : 'false';

                const fn = currentHost === 'aftereffects'
                    ? 'importMediaIntoAfterEffects'
                    : (currentHost === 'audition' ? 'importMediaIntoAudition' : 'importMediaIntoPremiere');
                const script = `${fn}("${escapedPath}", "${escapedBin}", ${shouldInsert})`;

                csInterface.evalScript(script, function(result) {
                    try {
                        const parsed = JSON.parse(result);
                        outcome.success = !!parsed.success;
                        outcome.error = parsed.error || null;
                        outcome.clipName = parsed.clipName || null;
                    } catch (e) {
                        outcome.error = 'The editor returned an unreadable response: ' + String(result);
                    }
                    console.log("[Xdrop CEP] Import response:", result);
                    settle();
                });
            });
        }

        let pingTimer = null;

        function startPing() {
            if (pingTimer) clearInterval(pingTimer);
            pingTimer = setInterval(function() {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    try {
                        ws.send(JSON.stringify({ type: 'PING' }));
                    } catch (_) {}
                }
            }, 15000);
        }

        function stopPing() {
            if (pingTimer) {
                clearInterval(pingTimer);
                pingTimer = null;
            }
        }

        function connectWebSocket() {
            try {
                if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                    return;
                }

                ws = new WebSocket("ws://127.0.0.1:8484/ws");

                ws.onopen = function() {
                    console.log("[Xdrop CEP] Connected to Xdrop WebSocket. Host:", currentHost);
                    isEngineOnline = true;
                    showApp();
                    startPing();

                    checkHostProject(function(info) {
                        const frame = document.getElementById('app-frame');
                        if (frame && frame.contentWindow) {
                            frame.contentWindow.postMessage({
                                type: 'HOST_INFO',
                                host: currentHost,
                                projectInfo: info
                            }, '*');
                        }
                    });
                };

                ws.onmessage = function(event) {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === "PONG") return;

                        if (msg.type === "PREMIERE_IMPORT_REQUEST" && currentHost === "premiere" && msg.payload) {
                            importToHost(msg.payload.filePaths, msg.payload.targetBin, msg.payload.requestId, msg.payload.insertTimeline);
                        } else if (msg.type === "AFTEREFFECTS_IMPORT_REQUEST" && currentHost === "aftereffects" && msg.payload) {
                            importToHost(msg.payload.filePaths, msg.payload.targetBin, msg.payload.requestId, msg.payload.insertTimeline);
                        } else if (msg.type === "AUDITION_IMPORT_REQUEST" && currentHost === "audition" && msg.payload) {
                            importToHost(msg.payload.filePaths, msg.payload.targetBin, msg.payload.requestId, false);
                        }
                    } catch(e) {
                        console.error("[Xdrop CEP] Message error:", e);
                    }
                };

                ws.onerror = function(err) {
                    console.warn("[Xdrop CEP] WebSocket error:", err);
                    stopPing();
                };

                ws.onclose = function() {
                    stopPing();
                    setTimeout(function() {
                        checkServiceHealth(function(online) {
                            if (online) {
                                connectWebSocket();
                            } else {
                                isEngineOnline = false;
                                setStatus("Reconnecting to Engine...", "Waiting for service to resume...", true, true);
                            }
                        });
                    }, 3000);
                };
            } catch(e) {
                console.warn("[Xdrop CEP] WebSocket connect exception:", e);
                stopPing();
            }
        }

        window.addEventListener('message', function(event) {
            if (!event.data) return;

            if (event.data.type === 'IMPORT_TO_PREMIERE' || event.data.type === 'IMPORT_TO_AFTEREFFECTS') {
                importToHost(event.data.filePath, event.data.binName, event.data.requestId, event.data.insertTimeline);
            } else if (event.data.type === 'SETUP_BINS') {
                setupStarterBins();
            } else if (event.data.type === 'REQUEST_HOST_INFO') {
                checkHostProject(function(info) {
                    if (event.source) {
                        event.source.postMessage({
                            type: 'HOST_INFO',
                            host: currentHost,
                            projectInfo: info
                        }, '*');
                    }
                });
            }
        });

        function notifySessionClose() {
            try {
                const url = 'http://127.0.0.1:8484/api/system/session/close?client=' + encodeURIComponent(currentHost);
                if (navigator && navigator.sendBeacon) {
                    navigator.sendBeacon(url);
                } else {
                    fetch(url, { method: 'POST', keepalive: true }).catch(function() {});
                }
            } catch (_) {}
        }

        window.addEventListener('beforeunload', notifySessionClose);
        window.addEventListener('unload', notifySessionClose);

        if (typeof csInterface !== 'undefined' && csInterface.addEventListener) {
            try {
                csInterface.addEventListener('com.adobe.csxs.events.WindowClose', notifySessionClose);
            } catch (_) {}
        }

        function registerSessionOpen() {
            fetch('http://127.0.0.1:8484/api/system/session/open?client=' + encodeURIComponent(currentHost), {
                method: 'POST'
            }).catch(function() {});
        }

        // Heartbeat to keep session lease active
        setInterval(function() {
            if (isEngineOnline) {
                fetch('http://127.0.0.1:8484/api/system/session/heartbeat?client=' + encodeURIComponent(currentHost), {
                    method: 'POST'
                }).catch(function() {});
            }
        }, 8000);

        // Initialize on window load: probe health; if offline, auto-start immediately
        window.onload = function() {
            checkServiceHealth(function(online) {
                if (online) {
                    isEngineOnline = true;
                    showApp();
                    connectWebSocket();
                    registerSessionOpen();
                    setupStarterBins();
                } else {
                    tryAutoStartEngine();
                }
            });
        };
    </script>
</body>
</html>
